<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Psync - Criar Minha Conta</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, rgba(13, 202, 240, 0.12), transparent 50%),
            radial-gradient(circle at bottom left, rgba(13, 202, 240, 0.05), transparent 50%);
        }
        .register-card {
            max-width: 540px;
            width: 100%;
        }
        .input-group .form-control,
        .input-group .input-group-text,
        .input-group .form-select,
        .input-group .btn {
            height: 48px;
            display: flex;
            align-items: center;
        }
        .input-group .btn {
            justify-content: center;
        }
    </style>
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center py-5">

<div class="container d-flex justify-content-center">
    <div class="register-card">

        <!-- Logo e Cabeçalho -->
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <h1 class="fw-bold text-info display-5 mb-0">Psync</h1>
            </a>
            <p class="text-secondary small mt-1">Crie sua conta e comece a gerenciar em poucos minutos</p>
        </div>

        <!-- Card de Cadastro -->
        <div class="card bg-body-tertiary border-secondary shadow-lg p-4 p-sm-5 rounded-4">

            <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>
            <form th:action="@{/cadastro}" th:object="${cadastro}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Nome do Profissional (Obrigatório) -->
                <div class="mb-3">
                    <label for="nome" class="form-label fw-medium text-light">Nome Completo *</label>
                    <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-person"></i>
                            </span>
                        <input type="text" class="form-control bg-dark border-secondary text-light" id="nome" th:field="*{nome}" placeholder="Digite seu nome completo" required autofocus>
                    </div>
                </div>

                <!-- Razão Social / Nome Fantasia (Opcional) -->
                <div class="mb-3">
                    <label for="razaoSocial" class="form-label fw-medium text-light">Razão Social / Nome Fantasia <span class="text-secondary fw-normal">(Opcional)</span></label>
                    <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-building"></i>
                            </span>
                        <input type="text" class="form-control bg-dark border-secondary text-light" id="razaoSocial" th:field="*{razaoSocial}" placeholder="Ex: Clínica Psync Saúde">
                    </div>
                </div>

                <!-- E-mail (Obrigatório) -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-medium text-light">E-mail Profissional *</label>
                    <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-envelope"></i>
                            </span>
                        <input type="email" class="form-control bg-dark border-secondary text-light" id="email" th:field="*{email}" placeholder="seu@email.com" required>
                    </div>
                </div>

                <!-- Telefone / WhatsApp (Obrigatório) -->
                <div class="mb-3">
                    <label for="telefone" class="form-label fw-medium text-light">Telefone / WhatsApp *</label>
                    <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-whatsapp"></i>
                            </span>
                        <input type="tel" class="form-control bg-dark border-secondary text-light" id="telefone" th:field="*{telefone}" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <!-- Tipo de Documento e Campo CPF/CNPJ (Obrigatório) -->
                <div class="mb-3">
                    <label for="documento" class="form-label fw-medium text-light">Documento (CPF ou CNPJ) *</label>
                    <div class="input-group">
                        <select class="form-select bg-dark border-secondary text-light" id="tipoDocumento" name="tipoDocumento" style="max-width: 110px;">
                            <option value="CPF" selected>CPF</option>
                            <option value="CNPJ">CNPJ</option>
                        </select>
                        <input type="text" class="form-control bg-dark border-secondary text-light" id="documento" th:field="*{documento}" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <!-- Área / Segmento de Atuação (Obrigatório) -->
                <div class="mb-3">
                    <label for="seguimentoTipo" class="form-label fw-medium text-light">Segmento de Atuação *</label>
                    <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-briefcase"></i>
                            </span>
                        <select class="form-select bg-dark border-secondary text-light" id="seguimentoTipo" th:field="*{seguimentoTipo}" required>
                            <option value="" disabled selected>Selecione sua área...</option>
                            <option value="PSICOLOGIA">Psicologia</option>
                            <option value="ODONTOLOGIA">Odontologia</option>
                            <option value="ADVOCACIA">Advocacia</option>
                            <option value="OUTRO">Outro / Geral</option>
                        </select>
                    </div>
                </div>

                <!-- Senha (Obrigatório) -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-medium text-light">Senha de Acesso *</label>
                    <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-lock"></i>
                            </span>
                        <input type="password" class="form-control bg-dark border-secondary text-light" id="password" th:field="*{password}" placeholder="Mínimo de 8 caracteres" minlength="8" required>
                        <button class="btn btn-outline-secondary border-secondary bg-dark" type="button" id="togglePassword">
                            <i class="bi bi-eye text-secondary" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Botão de Criar Conta -->
                <button type="submit" class="btn btn-info text-dark fw-bold w-100 py-2 shadow-sm fs-6">
                    Criar Conta Grátis <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

        </div>

        <!-- Rodapé -->
        <div class="text-center mt-4">
            <p class="text-secondary small mb-1">
                Já possui uma conta? <a href="/login" class="text-info text-decoration-none fw-medium">Fazer Login</a>
            </p>
            <a href="/" class="text-secondary text-decoration-none small d-inline-block mt-2">
                <i class="bi bi-arrow-left me-1"></i> Voltar para a página inicial
            </a>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Scripts de Interatividade -->
<script>
    // Alternar visibilidade da senha
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const eyeIcon = document.querySelector('#eyeIcon');

    togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        eyeIcon.classList.toggle('bi-eye');
        eyeIcon.classList.toggle('bi-eye-slash');
    });

    // Alternar Placeholder do Documento (CPF / CNPJ)
    const tipoDocumento = document.querySelector('#tipoDocumento');
    const documentoInput = document.querySelector('#documento');

    tipoDocumento.addEventListener('change', function () {
        if (this.value === 'CNPJ') {
            documentoInput.placeholder = '00.000.000/0001-00';
        } else {
            documentoInput.placeholder = '000.000.000-00';
        }
    });
</script>
</body>
</html>
