<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${segmento != null} ? 'Psync - Novo ' + ${segmento.termoCliente} : 'Psync - Novo Cliente'">Psync - Novo Cliente</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-dark text-light">

<!-- Barra de Navegação Superior -->
<nav class="navbar navbar-expand-lg navbar-dark bg-body-tertiary border-bottom border-secondary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-info fs-4" href="/home">Psync</a>
        <span class="badge bg-info bg-opacity-20 text-info border border-info ms-2"
              th:text="${segmento != null} ? ${segmento.descricao} : 'Psicologia'">Psicologia</span>

        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/home(segmento=${segmento})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Voltar ao Painel
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="card bg-body-tertiary border-secondary p-4 rounded-4 shadow-sm">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="p-3 bg-info bg-opacity-10 text-info rounded-circle fs-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <div>
                <h2 class="h4 fw-bold mb-0 text-info"
                    th:text="${segmento != null} ? 'Novo Cadastro de ' + ${segmento.termoCliente} : 'Novo Cadastro de Paciente'">Novo Cadastro</h2>
                <p class="text-secondary small mb-0">Preencha as informações básicas para iniciar o acompanhamento.</p>
            </div>
        </div>

        <!-- Alerta de Sucesso -->
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show border-success bg-success bg-opacity-10 text-success mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensagemSucesso}">Cadastro realizado com sucesso!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Alerta de Erro (Ex: CPF/CNPJ duplicado ou validação) -->
        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show border-danger bg-danger bg-opacity-10 text-danger mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mensagemErro}">Ocorreu um erro no cadastro.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/salvar-cliente(segmento=${segmento})}" method="post" th:object="${clienteFinal}">
                <!-- Campos Ocultos para preservar os IDs na edição -->
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{dadosCadastro.id}" />

                <div class="row">
                <!-- Nome Completo -->
                <div class="col-md-6 mb-3">
                    <label for="nome" class="form-label text-secondary small fw-medium">Nome Completo</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="nome"
                           th:field="*{dadosCadastro.nome}" required placeholder="Ex: Maria Silva">
                </div>

                <!-- CPF / CNPJ -->
                <div class="col-md-6 mb-3">
                    <label for="cpf" class="form-label text-secondary small fw-medium">CPF / CNPJ</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="cpf"
                           th:field="*{dadosCadastro.cpfCnpj}" placeholder="000.000.000-00">
                </div>
            </div>

            <div class="row">
                <!-- Data de Nascimento -->
                <div class="col-md-4 mb-3">
                    <label for="dataNascimento" class="form-label text-secondary small fw-medium">Data de Nascimento</label>
                    <input type="date" class="form-control bg-dark text-light border-secondary" id="dataNascimento"
                           th:field="*{dadosCadastro.dataNascimento}">
                </div>

                <!-- Telefone / WhatsApp -->
                <div class="col-md-4 mb-3">
                    <label for="telefone" class="form-label text-secondary small fw-medium">Telefone / WhatsApp</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="telefone"
                           th:field="*{dadosCadastro.telefone}" placeholder="(83) 99999-9999">
                </div>

                <!-- E-mail -->
                <div class="col-md-4 mb-3">
                    <label for="email" class="form-label text-secondary small fw-medium">E-mail</label>
                    <input type="email" class="form-control bg-dark text-light border-secondary" id="email"
                           th:field="*{email}" placeholder="cliente@email.com">
                </div>
            </div>

            <div class="row">
                <!-- Profissão -->
                <div class="col-md-4 mb-3">
                    <label for="profissao" class="form-label text-secondary small fw-medium">Profissão</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="profissao"
                           th:field="*{dadosCadastro.profissao}">
                </div>

                <!-- Contato de Emergência -->
                <div class="col-md-4 mb-3">
                    <label for="contatoEmergencia" class="form-label text-secondary small fw-medium">Contato de Emergência</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="contatoEmergencia"
                           th:field="*{dadosCadastro.contatoEmergencia}">
                </div>

                <!-- Tel. Emergência -->
                <div class="col-md-4 mb-3">
                    <label for="telefoneEmergencia" class="form-label text-secondary small fw-medium">Tel. Emergência</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="telefoneEmergencia"
                           th:field="*{dadosCadastro.telefoneEmergencia}">
                </div>
            </div>

            <!-- Observações Iniciais -->
            <div class="mb-4">
                <label for="observacoesIniciais" class="form-label text-secondary small fw-medium">Observações Iniciais</label>
                <textarea class="form-control bg-dark text-light border-secondary" id="observacoesIniciais"
                          th:field="*{dadosCadastro.observacoesIniciais}" rows="3" placeholder="Queixas principais, histórico inicial, etc."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/home(segmento=${segmento})}" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-info text-dark fw-bold px-4">
                    <i class="bi bi-check-circle-fill me-1"></i> Salvar
                </button>
            </div>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
